<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispatch Desk training lab</title>
<style>body{font:18px/1.6 system-ui;background:#f3f6fa;color:#183047;margin:0}main{max-width:900px;margin:auto;padding:24px}input,select,button{font:inherit;padding:10px;margin:6px;max-width:100%;box-sizing:border-box}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px;border:1px solid #64748b;border-radius:8px}label{display:block}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #007d96}fieldset{margin:20px 0;min-width:0}</style>
<main><h1>Dispatch Desk</h1><p>Local training only. Synthetic data. A deterministic fixture provider is active: this page does not call a live LLM.</p>
<label>Demo identity<select id="actor"><option>operator-a</option><option>operator-b</option></select></label>
<fieldset><legend>Try the language contract</legend><label>Request<input id="text" value="Show held parcels"></label><label>Injected provider outcome<select id="fault"><option>none</option><option>timeout</option><option>unknown_field</option><option>malformed</option><option>unknown_citation</option><option>wrong_count</option></select></label><button id="intent">Propose a filter</button><button id="list">Read permitted shipments</button><button id="brief">Exact briefing</button></fieldset>
<fieldset><legend>Follow a background explanation</legend><label>Permitted shipment ID<input id="shipment" type="number" min="1" value="1"></label><button id="facts">Verified facts</button><button id="explain">Start explanation</button><button id="result">Read latest run</button></fieldset><p role="status" id="status">Ready. Use the normal shipment list when language assistance is unavailable.</p><pre id="output">Results appear here.</pre>
<script>let runId=null;const el=id=>document.getElementById(id);async function call(path,body){el('status').textContent='Loading';try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Learning-Actor':el('actor').value},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();el('output').textContent=JSON.stringify(data,null,2);el('status').textContent=r.ok?'Response received - inspect its state and labels':'Request unavailable';return data}catch{el('status').textContent='Network unavailable'}}el('intent').onclick=()=>call('/training/intent',{text:el('text').value,fault:el('fault').value});el('list').onclick=()=>call('/training/shipments');el('brief').onclick=()=>call('/training/briefing');el('facts').onclick=()=>call('/training/shipments/'+Number(el('shipment').value)+'/facts');el('explain').onclick=async()=>{const r=await call('/training/explanations',{shipment_id:Number(el('shipment').value),fault:el('fault').value});runId=r?.id};el('result').onclick=()=>runId?call('/training/runs/'+runId):el('status').textContent='Start a run first';el('actor').onchange=()=>{runId=null;el('output').textContent='Identity changed. Fetch current permitted data.'};</script></main></html>
